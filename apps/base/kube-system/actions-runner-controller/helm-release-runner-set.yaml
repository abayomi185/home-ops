# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
# Ephemeral Docker-in-Docker runners. The pod template is spelled out (instead of
# containerMode: dind) so resources can be set. A job loads either the runner (lint,
# typecheck, tests) or dind (image builds), rarely both, so one pod-level budget is
# shared instead of splitting it into per-container limits.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-runner-set
spec:
  interval: 30m
  dependsOn:
    - name: arc-controller
  chart:
    spec:
      chart: gha-runner-scale-set
      version: 0.14.2
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller-charts
      interval: 5m
  values:
    controllerServiceAccount:
      namespace: arc-system
      name: arc-controller
    template:
      spec:
        resources:
          requests:
            cpu: "1"
            memory: 2Gi
          limits:
            cpu: "3"
            memory: 6Gi
        # Keep CI off the control-plane/etcd node: a full disk there takes down the cluster.
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: node-role.kubernetes.io/control-plane
                      operator: DoesNotExist
        initContainers:
          - name: init-dind-externals
            image: ghcr.io/actions/actions-runner:2.337.0
            command: ["cp", "-r", "/home/runner/externals/.", "/home/runner/tmpDir/"]
            volumeMounts:
              - name: dind-externals
                mountPath: /home/runner/tmpDir
          - name: dind
            image: docker:29.8.1-dind
            args:
              - dockerd
              - --host=unix:///var/run/docker.sock
              - --group=$(DOCKER_GROUP_GID)
              # Keep dind bridge packets under the pod network MTU (overlay CNIs are <1500);
              # otherwise large downloads inside image builds (apk, npm) stall silently.
              - --mtu=1400
            env:
              - name: DOCKER_GROUP_GID
                value: "123"
            securityContext:
              privileged: true
            # Disk is bounded per container (pod-level resources only cover CPU/memory).
            # Exceeding the limit evicts the job instead of filling the node disk.
            resources:
              requests:
                ephemeral-storage: 3Gi
              limits:
                ephemeral-storage: 10Gi
            restartPolicy: Always
            startupProbe:
              exec:
                command: ["docker", "info"]
              initialDelaySeconds: 0
              failureThreshold: 24
              periodSeconds: 5
            volumeMounts:
              - name: work
                mountPath: /home/runner/_work
              - name: dind-sock
                mountPath: /var/run
              - name: dind-externals
                mountPath: /home/runner/externals
              - name: dind-storage
                mountPath: /var/lib/docker
        containers:
          - name: runner
            image: ghcr.io/actions/actions-runner:2.337.0
            command: ["/home/runner/run.sh"]
            env:
              - name: DOCKER_HOST
                value: unix:///var/run/docker.sock
              - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
                value: "120"
            resources:
              requests:
                ephemeral-storage: 1Gi
              limits:
                ephemeral-storage: 4Gi
            volumeMounts:
              - name: work
                mountPath: /home/runner/_work
              - name: dind-sock
                mountPath: /var/run
        volumes:
          - name: work
            emptyDir: {}
          - name: dind-sock
            emptyDir: {}
          - name: dind-externals
            emptyDir: {}
          - name: dind-storage
            emptyDir: {}
