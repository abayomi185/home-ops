# Traefik reads secrets (TLS, middleware secrets like the CrowdSec bouncer
# key) only in namespaces it routes for, never flux-system or kube-system.
# Each routed namespace binds this next to its namespace.yaml; keep that list
# in sync with --providers.kubernetescrd.namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: traefik-secrets-reader
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: traefik-secrets-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: traefik-secrets-reader
subjects:
  - kind: ServiceAccount
    name: traefik-ingress-controller
    namespace: network-system
