apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: obsidian-couchdb
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`obsidian-couchdb.local.${DOMAIN}`)
      kind: Rule
      services:
        - name: obsidian-couchdb-service
          port: 5984
  tls:
    certResolver: letsencrypt
