apiVersion: v1
kind: Service
metadata:
  name: zigbee2mqtt
spec:
  type: ExternalName
  externalName: home.internal.${DOMAIN}
  ports:
    - name: http
      port: 8080
      protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: zigbee2mqtt
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`zigbee.home.local.${DOMAIN}`)
      kind: Rule
      middlewares:
        - name: home-assistant-lan
      services:
        - name: zigbee2mqtt
          port: 8080
  tls:
    certResolver: letsencrypt
    domains:
      - main: zigbee.home.local.${DOMAIN}
