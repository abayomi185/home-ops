apiVersion: v1
kind: Service
metadata:
  name: esphome
spec:
  type: ExternalName
  externalName: home.internal.${DOMAIN}
  ports:
    - name: http
      port: 6052
      protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: esphome
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`esphome.home.local.${DOMAIN}`)
      kind: Rule
      middlewares:
        - name: home-assistant-lan
      services:
        - name: esphome
          port: 6052
  tls:
    certResolver: letsencrypt
    domains:
      - main: esphome.home.local.${DOMAIN}
