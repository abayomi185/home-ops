apiVersion: apps/v1
kind: Deployment
metadata:
  name: &deploymentName filestash-deployment
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: *deploymentName
  template:
    metadata:
      labels:
        app: *deploymentName
    spec:
      containers:
        - image: machines/filestash:latest@sha256:cf23f1f232352b084cb3a1864a5437cda2e141d53516402b6d22c3f3b7263a3c
          imagePullPolicy: IfNotPresent
          name: filestash
          env:
            - name: APPLICATION_URL
              value: files.${DOMAIN}
            - name: TZ
              value: Europe/London
          ports:
            - containerPort: 8334
              name: http
              protocol: TCP
          volumeMounts:
            - mountPath: /app/data/state
              name: config-data
              subPath: filestash/state
            - mountPath: /data
              name: share-data
              readOnly: true
      hostname: filestash
      # Volumes need to be defined in the patch file of flux deployment
