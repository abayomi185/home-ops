apiVersion: apps/v1
kind: Deployment
metadata:
  name: &deploymentName filestash-deployment
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: *deploymentName
  template:
    metadata:
      labels:
        app: *deploymentName
    spec:
      containers:
        - image: machines/filestash:latest@sha256:0e310316f71e6107a4c8777182003edfcc757ee5b8909d8db31365c050321951
          imagePullPolicy: IfNotPresent
          name: filestash
          env:
            - name: APPLICATION_URL
              value: files.${DOMAIN}
            - name: TZ
              value: Europe/London
          ports:
            - containerPort: 8334
              name: http
              protocol: TCP
          volumeMounts:
            - mountPath: /app/data/state
              name: config-data
              subPath: filestash/state
            - mountPath: /data
              name: share-data
              readOnly: true
      hostname: filestash
      # Volumes need to be defined in the patch file of flux deployment
