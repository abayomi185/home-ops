apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: authelia
spec:
  entryPoints:
    - websecure
    - public
  routes:
    - match: Host(`auth.local.${DOMAIN}`) || Host(`auth.${DOMAIN}`)
      kind: Rule
      services:
        - name: authelia-service
          port: 9091
  tls:
    certResolver: letsencrypt
