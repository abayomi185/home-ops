apiVersion: apps/v1
kind: Deployment
metadata:
  name: &deploymentName open-webui-deployment
spec:
  replicas: 1
  strategy:
    type: Recreate # SQLite on NFS: never run two pods against webui.db
  selector:
    matchLabels:
      app: *deploymentName
  template:
    metadata:
      labels:
        app: *deploymentName
    spec:
      containers:
        - image: ghcr.io/open-webui/open-webui:main@sha256:ff7f7cbb4545aacec2c22d085b2bc406b299c119bd98747421124a1a6c03795f
          imagePullPolicy: IfNotPresent
          name: open-webui
          # Startup logs "Permission denied" copying static assets into the
          # root-owned image dir; harmless, the image already ships them
          securityContext:
            runAsUser: 1001
            runAsGroup: 100
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            # Default is /app/backend (root-owned, lost on restart)
            - name: WEBUI_SECRET_KEY_FILE
              value: /app/backend/data/.webui_secret_key
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          volumeMounts:
            - mountPath: /app/backend/data
              name: config-data
              subPath: open-webui/config
      hostname: open-webui
      volumes:
        - name: config-data
          nfs:
            server: ${NFS_STORAGE_HOST_FAST}
            path: ${NFS_STORAGE_CONFIG_DATA_PATH}
