apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: filebrowser
spec:
  entryPoints:
    - websecure
    - public
  routes:
    - match: Host(`files.local.${DOMAIN}`)
      kind: Rule
      services:
        - name: filebrowser-service
          port: 80
    - match: Host(`files.${DOMAIN}`)
      kind: Rule
      services:
        - name: filebrowser-service
          port: 80
  tls:
    certResolver: letsencrypt
