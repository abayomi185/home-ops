apiVersion: v1
kind: ConfigMap
metadata:
  name: opencloud-config
data:
  # Users need one of these Authelia groups, otherwise login is denied
  proxy.yaml: |
    role_assignment:
      driver: oidc
      oidc_role_mapper:
        role_claim: groups
        role_mapping:
          - role_name: admin
            claim_value: admins
          - role_name: user
            claim_value: opencloud
  csp.yaml: |
    directives:
      child-src:
        - '''self'''
      connect-src:
        - '''self'''
        - 'blob:'
        - 'https://auth.${DOMAIN}/'
        - 'https://raw.githubusercontent.com/opencloud-eu/awesome-apps/'
        - 'https://update.opencloud.eu/'
      default-src:
        - '''none'''
      font-src:
        - '''self'''
      frame-ancestors:
        - '''self'''
      frame-src:
        - '''self'''
        - 'blob:'
        - 'https://embed.diagrams.net/'
        - 'https://auth.${DOMAIN}/'
      img-src:
        - '''self'''
        - 'data:'
        - 'blob:'
        - 'https://raw.githubusercontent.com/opencloud-eu/awesome-apps/'
      manifest-src:
        - '''self'''
      media-src:
        - '''self'''
        - 'blob:'
      object-src:
        - '''self'''
        - 'blob:'
      script-src:
        - '''self'''
        - '''unsafe-inline'''
        - 'https://auth.${DOMAIN}/'
      style-src:
        - '''self'''
        - '''unsafe-inline'''
        - 'blob:'
      worker-src:
        - '''self'''
        - 'blob:'
