apiVersion: apps/v1
kind: Deployment
metadata:
  name: &deploymentName uptime-kuma-deployment
spec:
  replicas: 1
  strategy:
    type: Recreate # SQLite on NFS: never run two pods against kuma.db
  selector:
    matchLabels:
      app: *deploymentName
  template:
    metadata:
      labels:
        app: *deploymentName
    spec:
      containers:
        - name: uptime-kuma
          image: louislam/uptime-kuma:2.5.12@sha256:8e4b6bef96417ec98a35dc103c99cc64fc229a01e584e56d95d9004d2003c02a
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 1001
            runAsGroup: 100
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL] # ping monitors would need add: [NET_RAW]
          env:
            - name: TZ
              value: Europe/London
          ports:
            - containerPort: 3001
              name: http
              protocol: TCP
          volumeMounts:
            - mountPath: /app/data
              name: config-volume
              subPath: uptime-kuma
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 600
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 100Mi
            limits:
              cpu: 500m
              memory: 500Mi
      volumes:
        - name: config-volume
          nfs:
            server: ${NFS_STORAGE_HOST_FAST}
            path: ${NFS_STORAGE_CONFIG_DATA_PATH}
