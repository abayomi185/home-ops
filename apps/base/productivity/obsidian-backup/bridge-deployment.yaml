# livesync-bridge mirrors the LiveSync CouchDB vault to plain files on NFS.
# No published image: run a pinned upstream commit on the official Deno image.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: &deploymentName obsidian-backup-bridge-deployment
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: *deploymentName
  template:
    metadata:
      labels:
        app: *deploymentName
    spec:
      securityContext:
        runAsUser: 1001
        runAsGroup: 100
      initContainers:
        - name: fetch-source
          image: alpine/git:2.54.1@sha256:2306e2b05ee0ef99f5d25b0779f645b24ae9f91ba187107503592fcdfe78da3a
          env:
            - name: BRIDGE_COMMIT
              value: 1c252305bbddcacd200b8560d3bb786afe0906e9
          command: ["/bin/sh", "-c"]
          args:
            - >-
              git init -q /app/src &&
              git -C /app/src fetch -q --depth 1 https://github.com/vrtmrz/livesync-bridge "$BRIDGE_COMMIT" &&
              git -C /app/src checkout -q FETCH_HEAD
          volumeMounts:
            - mountPath: /app
              name: app
      containers:
        - name: bridge
          image: denoland/deno:2.9.8@sha256:a0d88a7fcbd44f062cba2748e19df67d30290ad12aa203c7c1e0b12462c483f0
          imagePullPolicy: IfNotPresent
          workingDir: /app/src
          command: ["/bin/sh", "-c"]
          args: ["deno install --frozen && exec deno run -A main.ts"]
          env:
            - name: TZ
              value: Europe/London
            - name: DENO_DIR
              value: /deno-dir
            - name: LSB_CONFIG
              value: /config/config.json
          volumeMounts:
            - mountPath: /app
              name: app
            - mountPath: /deno-dir
              name: deno-dir
            # Deno localStorage: bridge resume positions
            - mountPath: /deno-dir/location_data
              name: config-volume
              subPath: obsidian-backup/location_data
            - mountPath: /data/vault
              name: config-volume
              subPath: obsidian-backup/vault
            - mountPath: /config
              name: bridge-config
              readOnly: true
          # The bridge logs most failures and keeps running; it writes its own
          # health to /tmp/lsb-health.json every 10s (ts, ok, restartWorthy).
          startupProbe: # allows for `deno install` on each start
            exec:
              command: ["deno", "eval", "Deno.readTextFileSync('/tmp/lsb-health.json')"]
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe: # unready = not syncing (bad config/credentials, CouchDB down)
            exec:
              command:
                - deno
                - eval
                - "const h = JSON.parse(Deno.readTextFileSync('/tmp/lsb-health.json')); if (Date.now() - h.ts > 60000 || !h.ok) Deno.exit(1)"
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 10
          livenessProbe: # stale heartbeat = wedged event loop
            exec:
              command:
                - deno
                - eval
                - "const h = JSON.parse(Deno.readTextFileSync('/tmp/lsb-health.json')); if (Date.now() - h.ts > 60000 || h.restartWorthy) Deno.exit(1)"
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: app
          emptyDir: {}
        - name: deno-dir
          emptyDir: {}
        - name: bridge-config
          secret:
            secretName: obsidian-backup-secrets
            items:
              - key: bridge_config.json
                path: config.json
        - name: config-volume
          nfs:
            server: ${NFS_STORAGE_HOST_FAST}
            path: ${NFS_STORAGE_CONFIG_DATA_PATH}
