apiVersion: apps/v1
kind: Deployment
metadata:
  name: &deploymentName bambubuddy-deployment
spec:
  replicas: 1
  strategy:
    type: Recreate # SQLite on NFS: never run two pods on the same DB
  selector:
    matchLabels:
      app: *deploymentName
  template:
    metadata:
      labels:
        app: *deploymentName
    spec:
      containers:
        - env:
            - name: UMASK
              value: "007"
            - name: TZ
              value: Europe/London
            - name: PUID
              value: "1001"
            - name: PGID
              value: "100"
            - name: PORT
              value: "8000"
          image: ghcr.io/maziggy/bambuddy:1.3.0@sha256:f69650347010b279c85373fa52f0c9aab3982b5f10704fabbd76d7e46158eef5
          imagePullPolicy: IfNotPresent
          name: bambubuddy
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          volumeMounts:
            - mountPath: /app/data
              name: config-volume
              subPath: bambubuddy/data
            - mountPath: /app/logs
              name: config-volume
              subPath: bambubuddy/logs
      hostname: bambubuddy
      volumes:
        - name: config-volume
          nfs:
            server: ${NFS_STORAGE_HOST_FAST}
            path: ${NFS_STORAGE_CONFIG_DATA_PATH}
