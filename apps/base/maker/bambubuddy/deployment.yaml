apiVersion: apps/v1
kind: Deployment
metadata:
  name: &deploymentName bambubuddy-deployment
spec:
  replicas: 1
  strategy:
    type: Recreate # SQLite on NFS: never run two pods on the same DB
  selector:
    matchLabels:
      app: *deploymentName
  template:
    metadata:
      labels:
        app: *deploymentName
    spec:
      containers:
        - env:
            - name: UMASK
              value: "007"
            - name: TZ
              value: Europe/London
            - name: PUID
              value: "1001"
            - name: PGID
              value: "100"
            - name: PORT
              value: "8000"
            - name: BAMBUDDY_OIDC_NAME
              value: Authelia
            - name: BAMBUDDY_OIDC_ISSUER_URL
              value: https://auth.${DOMAIN}
            - name: BAMBUDDY_OIDC_CLIENT_ID
              value: bambubuddy
            - name: BAMBUDDY_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: bambubuddy-secrets
                  key: oidc_client_secret
            - name: BAMBUDDY_OIDC_SCOPES
              value: openid email profile groups
            - name: BAMBUDDY_OIDC_AUTO_LINK_EXISTING
              value: "true"
            - name: BAMBUDDY_OIDC_GROUP_MAPPING
              value: '{"admins": "Administrators"}'
          image: ghcr.io/abayomi185/bambuddy:emmc-1626170@sha256:14e25d9c830908a5c1f7d74c42b8595f8ece11dab559b4934344546095d7a6e9 # TEMP: fork testing maziggy/bambuddy#2762
          imagePullPolicy: IfNotPresent
          name: bambubuddy
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          volumeMounts:
            - mountPath: /app/data
              name: config-volume
              subPath: bambubuddy/data
            - mountPath: /app/logs
              name: config-volume
              subPath: bambubuddy/logs
      hostname: bambubuddy
      volumes:
        - name: config-volume
          nfs:
            server: ${NFS_STORAGE_HOST_FAST}
            path: ${NFS_STORAGE_CONFIG_DATA_PATH}
