apiVersion: apps/v1
kind: Deployment
metadata:
  name: filebrowser-deployment
spec:
  template:
    spec:
      volumes:
        - name: config-data
          nfs:
            server: ${NFS_STORAGE_HOST_FAST}
            path: ${NFS_STORAGE_CONFIG_DATA_PATH}
        # Existing Nextcloud share, mounted directly so it outlives Nextcloud
        - name: share-data
          nfs:
            server: ${NFS_STORAGE_HOST_FAST}
            path: ${NFS_STORAGE_MAIN_DATA_PATH}/nextcloud/nextcloud-shared-storage-pvc
      initContainers:
        # Container runs as 1001:100
        - name: set-permissions
          image: busybox:1.38@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
          command: ["sh", "-c", "mkdir -p /cfg/filebrowser/data && chown -R 1001:100 /cfg/filebrowser /share"]
          volumeMounts:
            - name: config-data
              mountPath: /cfg
            # Own the share so uploads work; also fixes files copied in by hand
            - name: share-data
              mountPath: /share
