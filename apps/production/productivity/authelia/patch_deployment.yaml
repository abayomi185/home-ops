apiVersion: apps/v1
kind: Deployment
metadata:
  name: authelia-deployment
spec:
  template:
    spec:
      # Prefer knode4 (pve-firewall) but allow failover to other nodes
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - knode4
      tolerations:
        - key: dedicated
          operator: Equal
          value: gpu
          effect: NoSchedule
