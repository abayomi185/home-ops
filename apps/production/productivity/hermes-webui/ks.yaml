---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hermes-webui-productivity
  namespace: flux-system
spec:
  targetNamespace: productivity
  path: ./apps/production/productivity/hermes-webui
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  dependsOn:
    - name: cluster-configs
    - name: hermes-agent-productivity-production
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
      - kind: Secret
        name: cluster-secrets
