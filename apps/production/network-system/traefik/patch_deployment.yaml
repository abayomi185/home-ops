apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: traefik
spec:
  template:
    spec:
      nodeSelector:
        yomitosh.media/ingress: "true"
      tolerations:
        - key: dedicated
          operator: Equal
          value: vps-public
          effect: NoSchedule
      containers:
        - name: traefik
          args:
            - "--entryPoints.web.address=:8000/tcp"
            - "--entryPoints.websecure.address=:8443/tcp"
            # Default 60s cuts off slow uploads
            - "--entryPoints.websecure.transport.respondingTimeouts.readTimeout=600s"
            - "--entryPoints.public.address=:8444/tcp"
            - "--entryPoints.public.transport.respondingTimeouts.readTimeout=600s"
            - "--entryPoints.traefik.address=:9000/tcp"
            - "--api=true"
            - "--api.dashboard=true"
            - "--ping=true"
            - "--providers.kubernetescrd"
            # Without cluster-wide secret access, watch only namespaces with routes.
            - "--providers.kubernetescrd.namespaces=maker,media,network-system,productivity"
            - "--providers.kubernetescrd.allowCrossNamespace=true"
            - "--providers.kubernetescrd.allowExternalNameServices=true"
            # ACME via Cloudflare DNS-01 challenge
            - "--certificatesresolvers.letsencrypt.acme.storage=/data/acme.json"
            - "--certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare"
            - "--certificatesresolvers.letsencrypt.acme.dnschallenge.delaybeforecheck=60"
            - "--certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53"
            # Default TLS certs — wildcards for public + LAN domains
            # internal.yomitosh.media is for infrastructure devices (Dnsmasq), not k8s apps
            - "--entrypoints.websecure.http.tls.domains[0].main=${DOMAIN}"
            - "--entrypoints.websecure.http.tls.domains[0].sans=*.${DOMAIN}"
            - "--entrypoints.websecure.http.tls.domains[1].main=local.${DOMAIN}"
            - "--entrypoints.websecure.http.tls.domains[1].sans=*.local.${DOMAIN}"
            # Public entrypoint (VPS IP) only gets the public wildcard
            - "--entrypoints.public.http.tls.domains[0].main=${DOMAIN}"
            - "--entrypoints.public.http.tls.domains[0].sans=*.${DOMAIN}"
            # Access logs feed CrowdSec; plugin is the CrowdSec bouncer
            - "--accesslog=true"
            # JSON lets CrowdSec take the last (Cloudflare-appended) X-Forwarded-For IP
            - "--accesslog.format=json"
            - "--accesslog.fields.headers.names.User-Agent=keep"
            # Public hosts are Cloudflare-proxied: keep CF's X-Forwarded-For (https://www.cloudflare.com/ips)
            - "--entryPoints.public.forwardedHeaders.trustedIPs=173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32"
            - "--experimental.plugins.crowdsec-bouncer.modulename=github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin"
            - "--experimental.plugins.crowdsec-bouncer.version=v1.8.1"
          volumeMounts:
            - mountPath: /plugins-storage
              name: plugins-storage
      volumes:
        - name: plugins-storage
          emptyDir: {}
