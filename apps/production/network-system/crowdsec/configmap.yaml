apiVersion: v1
kind: ConfigMap
metadata:
  name: crowdsec-helm-chart-value-overrides
data:
  values.yaml: |-
    container_runtime: containerd
    lapi:
      env:
        - name: BOUNCER_KEY_traefik
          valueFrom:
            secretKeyRef:
              name: crowdsec-bouncer-key
              key: key
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 500Mi
      persistentVolume:
        data:
          storageClassName: local-path
        config:
          storageClassName: local-path
    agent:
      # Every node, incl. tainted VPS/GPU nodes, so any pod's logs can be parsed
      tolerations:
        - key: dedicated
          operator: Exists
          effect: NoSchedule
      acquisition:
        - namespace: network-system
          podName: traefik-*
          program: traefik
        - namespace: media
          podName: jellyfin-deployment-*
          program: jellyfin
      env:
        - name: COLLECTIONS
          value: "crowdsecurity/traefik LePresidente/jellyfin"
        - name: PARSERS
          value: "crowdsecurity/whitelists"
      resources:
        requests:
          cpu: 50m
          memory: 100Mi
        limits:
          memory: 250Mi
