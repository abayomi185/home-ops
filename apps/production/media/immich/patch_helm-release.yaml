apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich-deployment
  namespace: media
spec:
  # See https://github.com/immich-app/immich-charts/blob/main/charts/immich/values.yaml
  # for the full list of values that can be overriden
  values:
    immich:
      existingConfiguration: immich-secrets
      configurationKind: Secret
      persistence:
        library:
          existingClaim: immich-data-pvc
    server:
      service:
        main:
          type: ClusterIP
          ports:
            http:
              port: 2283
              targetPort: 2283
      persistence:
        external-data-main:
          enabled: true
          existingClaim: immich-external-data-main-pvc
          globalMounts:
            - path: /usr/src/app/external-data/main
              readOnly: true
        external-data-ftp:
          enabled: true
          existingClaim: immich-external-data-ftp-pvc
          globalMounts:
            - path: /usr/src/app/external-data/ftp
              readOnly: true
      # nodeSelector:
      # kubernetes.io/hostname: knode3
      # intel.feature.node.kubernetes.io/gpu: "true"
      controllers:
        main:
          containers:
            main:
              image:
                repository: ghcr.io/immich-app/immich-server
                tag: "v3.2.2@sha256:79cc1623323d5894922686d8743b4780181428f98eecbfb58ce12c41ef02d1ea"
              env:
                DB_URL:
                  valueFrom:
                    secretKeyRef:
                      name: immich-database-app
                      key: uri
    valkey:
      enabled: true
    machine-learning:
      controllers:
        main:
          containers:
            main:
              image:
                repository: ghcr.io/immich-app/immich-machine-learning
                tag: "v3.2.2@sha256:60dfcf266a9ef3b7376f5678e8c980d4fb61db5fc48c078fe8a326ab1535d60d"
      # nodeSelector:
      #   kubernetes.io/hostname: knode2
      #   intel.feature.node.kubernetes.io/gpu: "true"
