apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: calibre-web
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`calibre.local.${DOMAIN}`)
      kind: Rule
      services:
        - name: calibre-web-service
          port: 8083
  tls:
    certResolver: letsencrypt
